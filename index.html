<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novembro de Ouro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mundo visual único: azul-marinho e laranja da Funchal, ouro só nos prêmios. Layout: cabeçalho com moedas flutuantes, abas, tabuleiro em trilha como peça central. */
:root{
  --navy:#081742; --navy2:#102766; --navy3:#18358a;
  --accent:#ff7a1a; --accent2:#ffa24d; --gold:#ffc531; --cream:#f7f0dd; --ink:#081742;
  --text:#eef2ff; --muted:#aab9e2; --line:rgba(255,255,255,.14);
  --ok:#3ddc97; --warn:#ffc531; --bad:#ff6b6b;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5}
body{background:radial-gradient(1100px 520px at 90% -10%,rgba(255,122,26,.30),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(24,53,138,.55),transparent 60%),var(--navy);min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* cabeçalho */
header.top{position:relative;overflow:hidden;padding:16px 0 4px}
.coins{position:absolute;inset:0;pointer-events:none}
.coin{position:absolute;top:-30px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc531 45%,#c98a00);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.3);animation:drift var(--t) linear var(--d) infinite;opacity:.55}
.coin::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid rgba(160,100,0,.55)}
@keyframes drift{0%{transform:translateY(-20px) rotateY(0);opacity:0}10%{opacity:.9}100%{transform:translateY(260px) rotateY(720deg);opacity:0}}
.brand{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:14px;min-height:44px}
.logos img{height:42px;width:auto;display:block}.logos img+img{padding-left:14px;border-left:1px solid var(--line)}
.wordmark{font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase;padding:8px 14px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent)}
.wordmark small{display:block;letter-spacing:.1em;font-weight:600;font-size:10px;color:var(--muted)}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.title h1{font-size:clamp(32px,5vw,48px);line-height:1;color:#fff}
.title h1 em{font-style:normal;background:linear-gradient(100deg,#ffc531 20%,#fff3b0 45%,#ffc531 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.tag{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);padding:4px 0 4px 14px;border-left:2px solid var(--accent)}
.meta{position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px;width:100%}
.pill{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:600;font-size:12px;color:var(--text)}
.pill.warn{border-color:var(--gold);color:var(--gold)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,23,66,.94);backdrop-filter:blur(6px);z-index:5}
nav.tabs button{background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 16px;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--text)}
main{padding:20px 0 60px}
.panel{background:linear-gradient(180deg,var(--navy2),#0e2058);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px}
.grid2>*,.grid3>*{min-width:0}
.feed{max-height:420px;overflow:auto;padding-right:4px}.gbottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.gbottom>*{min-width:0;margin:0}
@media(max-width:900px){.gbottom{grid-template-columns:1fr}}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
h2{font-size:26px;margin-bottom:6px}
h3{font-size:20px;margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.banner{background:rgba(255,197,49,.12);border:1px solid var(--gold);color:var(--gold);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:600}
.banner.err{background:rgba(255,107,107,.12);border-color:var(--bad);color:var(--bad)}
.banner.okb{background:rgba(61,220,151,.12);border-color:var(--ok);color:var(--ok)}

/* avatares */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;position:relative;color:#fff;font-weight:800;border:2px solid #fff;flex:none;vertical-align:middle;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}

/* tabuleiro + replay */
.boardbox{overflow-x:auto;border-radius:22px;border:10px solid #e8620c;outline:3px solid var(--gold);outline-offset:-3px;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.4);background:radial-gradient(ellipse at 50% 30%,#14398f 0%,#0b2763 55%,#061744 100%)}
.boardbox svg{display:block;width:100%;min-width:600px;height:auto}
.cell{cursor:pointer}
.cell:hover .c,.cell:focus-visible .c{filter:brightness(1.12)}
.tok{transition:transform .22s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,197,49,0))}50%{filter:drop-shadow(0 0 10px rgba(255,197,49,.95))}}
.fx{transform-box:fill-box;transform-origin:center;animation:fx 1.1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fx{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 70px)) rotate(var(--rot));opacity:0}}
.rise{font:800 15px var(--body);fill:#fff;stroke:#081742;stroke-width:4px;paint-order:stroke;animation:rise 2s ease-out forwards}
@keyframes rise{0%{transform:translateY(12px);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.replay{display:flex;align-items:center;gap:14px;margin:14px 0 4px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
.replay .play{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#081742;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.replay .play svg{width:14px;height:14px;fill:currentColor}
.replay .play:hover{background:var(--accent2)}
.days{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;padding:2px}
.dchip{flex:0 0 auto;min-width:56px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:4px 8px;line-height:1.15;font-size:11px;font-weight:600;text-align:center}
.dchip b{display:block;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.dchip:hover{border-color:var(--accent);color:var(--text)}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#081742}
.dchip[aria-pressed="true"] b{color:#081742}
.rl{width:100%;font-size:13px;color:var(--muted);margin:0}
.rl b{color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600;font-size:13px}
.chip.plain{padding:5px 14px}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cellinfo{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:56px;font-size:14px}

/* listas */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.feed .ic{font-size:24px;width:36px;text-align:center}
.feed small{color:var(--muted);display:block;font-size:12px}
.empty{color:var(--muted);padding:10px 0}
.teamrow{display:flex;gap:12px;margin-bottom:12px}
.team{flex:1;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.team b{display:block;font-family:var(--display);font-size:34px;font-weight:400;color:var(--gold);line-height:1.1}
.team span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.team small{color:var(--muted);font-size:12px}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:6px 0 22px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(170px,30%);text-align:center;cursor:pointer}
.pod .nm{font-weight:700;font-size:14px;line-height:1.2}
.pod .st{font-size:12px;color:var(--muted)}
.pod .blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:8px;font-family:var(--display);font-size:34px;color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.35);animation:grow .9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.crown{font-size:26px;margin-bottom:-6px;animation:bob 1.8s ease-in-out infinite}

table{border-collapse:collapse;width:100%}
.tscroll{overflow-x:auto}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.trow:hover td{background:rgba(255,255,255,.05)}
tr.trow{cursor:pointer}
.rank{font-family:var(--display);font-size:22px;color:var(--gold);width:44px}
.bar{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width 1s ease}
.tbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}

.tile{padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15}
.tile span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tile small{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
select{background:var(--navy);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;min-width:240px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.who{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}

/* coach */
.coach{border:1px solid var(--accent);background:linear-gradient(180deg,rgba(255,122,26,.14),rgba(255,122,26,.04))}
.verdict{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin:12px 0;font-weight:600}
.verdict.ok{background:rgba(61,220,151,.14);border:1px solid var(--ok)}
.verdict.mid{background:rgba(255,197,49,.14);border:1px solid var(--gold)}
.verdict.hard{background:rgba(255,107,107,.14);border:1px solid var(--bad)}
.verdict .vi{font-size:28px}
.big{font-family:var(--display);font-size:30px;color:var(--gold);line-height:1.1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
@media(max-width:700px){.facts{grid-template-columns:1fr 1fr}}
.fact{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}
.fact span{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fact b{font-size:18px}
.plan{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.plan span{padding:5px 12px;border-radius:10px;background:var(--navy3);font-weight:600;font-size:13px}
.mix{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.07);margin-top:8px}

.pcard{border-radius:16px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(255,255,255,.18);transition:transform .2s}
.pcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.pcard .bigi{font-size:44px;line-height:1}
.pcard h3{margin:0;font-size:22px}
.pcard p{margin:0;opacity:.95;font-size:14px}
.hn{display:inline-block;min-width:30px;text-align:center;padding:2px 7px;margin:2px;border-radius:8px;background:rgba(0,0,0,.28);font-weight:700;font-size:12px}
.hn.hit{background:#fff;color:var(--ink)}
.rule{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rule .ri{font-size:26px;text-align:center}
.rule b{display:block}.rule small{color:var(--muted)}
.pts{font-family:var(--display);font-size:22px;padding:4px 14px;border-radius:10px;background:var(--navy3)}
.pts.neg{background:#3a3f4d;color:#ffb3b3}
ol.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px}
.step .no{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.warnlist{margin:8px 0 0;padding-left:18px;color:var(--gold);font-size:14px}
code{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:6px;font-size:.92em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer{color:var(--muted);font-size:13px;padding:10px 0 40px;text-align:center}
@media(prefers-reduced-motion:reduce){.tok{transition:none}.glow,.bob,.coin,.fx,.rise,.title h1 em,.pod .blk,.crown{animation:none}.bar i{transition:none}}
.hcard{position:fixed;z-index:50;pointer-events:none;display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:14px;background:#0e2058;border:1px solid var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.hcard.on{opacity:1;transform:none}
.hcard b{display:block;font-size:14px}.hcard small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header class="top"><div class="coins" id="coins" aria-hidden="true"></div>
<div class="wrap">
  <div class="brand">
    <div class="logos" id="logos"></div>
    <div class="title"><h1>NOVEMBRO <em>DE OURO</em></h1><span class="tag">Recuperar · Conquistar · Evoluir</span></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<div class="wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav></div>
</header>
<main class="wrap" id="view"></main>
<footer>É jogo de equipe, mas a vitória é sua.</footer>

<script>
/* =========================================================
   1) DADOS DE EXEMPLO (aparecem se a planilha não puder ser lida)
   ========================================================= */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const dec=n=>(Math.round(n*10)/10).toString().replace('.',',');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CATS=[['pagamento','Pagamento confirmado e elegível',1,'Pagam.'],['acordo','Acordo efetivado',1,'Acordo'],['meta','Meta diária atingida',1,'Meta'],['localizacao','Localização de contrato',1,'Localiz.'],['atraso','Atrasos / faltas injustificadas',-1,'Atrasos'],['monitoria','Pontuação grave na monitoria',-1,'Monitoria']];
const short=o=>o.apelido||o.nome.split(' ')[0];

function compute(D){
  const N=+D.config.casas||50, k=+D.config.casasPorPonto||1, modo=D.config.modo==='passagem'?'passagem':'pouso';
  const pm={};D.premios.forEach(p=>pm[p.id]=p);
  const casaP={};D.casas.forEach(c=>{if(pm[c.premio])casaP[c.n]=pm[c.premio];});
  const dates=[...new Set(D.lancamentos.map(l=>l.data))].sort();
  const entreg={};D.entregas.forEach(e=>entreg[slug(e.operador)+'|'+e.casa]=!!e.entregue);
  const ops=D.operadores.map(o=>{
    const rows=D.lancamentos.filter(l=>slug(l.operador)===slug(o.nome));
    let pos=0,total=0;const days=[],prizes=[],won=new Set(),cat={};
    CATS.forEach(c=>cat[c[0]]=0);
    dates.forEach(d=>{
      const rs=rows.filter(r=>r.data===d);const v={};CATS.forEach(c=>v[c[0]]=rs.reduce((a,r)=>a+(+r[c[0]]||0),0));
      const pts=CATS.reduce((a,c)=>a+v[c[0]]*c[2],0);
      const prev=pos;pos=Math.max(0,Math.min(N,pos+pts*k));total+=pts;CATS.forEach(c=>cat[c[0]]+=v[c[0]]);
      const got=[];
      if(pos>prev){
        const hs=modo==='passagem'?Array.from({length:pos-prev},(_,i)=>prev+1+i):[pos];
        hs.forEach(h=>{if(casaP[h]&&!won.has(h)){won.add(h);const pr={casa:h,premio:casaP[h],data:d,operador:o.nome,apelido:short(o),entregue:!!entreg[slug(o.nome)+'|'+h]};prizes.push(pr);got.push(pr);}});
      }
      days.push({data:d,v,pts,pos,prev,cum:total,got});
    });
    const dn=Math.max(1,dates.length);
    return {...o,id:slug(o.nome),pos,total,days,prizes,cat,hoje:days.length?days[days.length-1].pts:0,avg:total/dn,best:days.length?Math.max(...days.map(d=>d.pts)):0};
  });
  const ranking=[...ops].sort((a,b)=>b.pos-a.pos||b.total-a.total||a.nome.localeCompare(b.nome));
  ranking.forEach((o,i)=>o.rank=i+1);
  const feed=ops.flatMap(o=>o.prizes).sort((a,b)=>b.data.localeCompare(a.data)||b.casa-a.casa);
  const teams={};ops.forEach(o=>{const t=o.equipe||'—';teams[t]=teams[t]||{pontos:0,n:0};teams[t].pontos+=o.total;teams[t].n++;});
  const dias=+D.config.dias||7;
  return {N,k,modo,ops,ranking,feed,casaP,pm,dates,teams,ultimo:dates[dates.length-1],dias,daysLeft:Math.max(0,dias-dates.length)};
}
/* estado do tabuleiro em um dia (-1 = início) */
function posAt(o,i){return i<0||!o.days[i]?0:o.days[i].pos;}
function dayStats(i){
  const rk=C.ops.map(o=>({o,pos:posAt(o,i),cum:i<0||!o.days[i]?0:o.days[i].cum})).sort((a,b)=>b.pos-a.pos||b.cum-a.cum||a.o.nome.localeCompare(b.o.nome));
  const teams={};rk.forEach(r=>{const t=r.o.equipe||'—';teams[t]=teams[t]||{pontos:0,n:0};teams[t].pontos+=r.cum;teams[t].n++;});
  const lim=i<0?'':C.dates[i];
  const feed=C.feed.filter(f=>f.data<=lim);
  return {rk,teams,feed};
}

const SHEET_ID='1K_5SCBCn_GwvsXUisJh7eHrvti7BPxIkZDgqr5CrP8s';
const BUILD='20261123141315';
const REFRESH_MS=2*60*1000;
const EXPECT={config:['chave','valor'],operadores:['nome','equipe'],lancamentos:['data','operador'],casas:['casa','premio'],premios:['nome','icone'],entregas:['operador','casa']};
const TABNAME={config:'Config',operadores:'Operadores',lancamentos:'Lancamentos',casas:'Casas',premios:'Premios',entregas:'Entregas'};
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===','){r.push(f);f='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f='';}else f+=c;}
  if(f!==''||r.length){r.push(f);rows.push(r);}return rows;}
async function fetchTab(key){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(TABNAME[key]);
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('A planilha não respondeu (código '+res.status+'). Confira se o compartilhamento está como "qualquer pessoa com o link".');
  const rows=parseCSV(await res.text()).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length)return [];
  const head=rows[0].map(nk);
  if(!EXPECT[key].every(k=>head.includes(k)))return null; // o Google devolve a 1ª aba quando o nome não existe
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=r[i]??'');return o;}).filter(o=>Object.values(o).some(v=>String(v).trim()!==''));
}
async function loadSheet(){
  try{
    if(!SHEET_ID)throw new Error('Planilha não configurada.');
    const wb={};await Promise.all(Object.keys(EXPECT).map(async k=>{wb[k]=await fetchTab(k);}));
    const {D,warn}=parseWorkbook(wb);
    if(!D.operadores.length)throw new Error('A aba Operadores está vazia ou ilegível.');
    const js=JSON.stringify(D),mudou=js!==LOAD.json;
    LOAD={warn,erro:null,quando:new Date(),json:js};tickLastRead();
    if(mudou){try{localStorage.setItem('nd_cache',js);}catch(e){}setData(D,{tipo:'planilha',quando:new Date().toISOString()});}
    else if(tab==='gestor')render();
  }catch(e){
    LOAD.erro=(e&&e.message)||'Falha ao ler a planilha.';
    if(SRC.tipo==='demo'){try{const c=localStorage.getItem('nd_cache');if(c){setData(JSON.parse(c),{tipo:'cache'});return;}}catch(x){}}
    if(tab==='gestor')render();
  }
}

/* =========================================================
   4) PLANILHA -> DADOS
   ========================================================= */
const nk=s=>slug(s).replace(/-/g,'');
function rowsOf(wb,name){return wb[name]||null;}
function toDate(v){
  if(v===''||v==null)return '';
  if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];let d=+m[1],mo=+m[2];if(mo>12&&d<=12)[d,mo]=[mo,d];return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  return '';
}
const num=v=>{if(typeof v==='string'){const t=nk(v);if(['sim','s','x','ok'].includes(t))return 1;if(['nao','n'].includes(t))return 0;}const n=Number(String(v).replace(',','.'));return isFinite(n)?n:0;};
function parseWorkbook(wb){
  const warn=[],D={config:{...DEMO.config,exemplo:false},premios:[],casas:[],operadores:[],lancamentos:[],entregas:[]};
  const cfg=rowsOf(wb,'config');
  if(cfg)cfg.forEach(r=>{const k=nk(r.chave||r.campo||r.parametro),v=r.valor;
    if(k==='campanha'||k==='nome')D.config.campanha=String(v);
    else if(k==='inicio')D.config.inicio=toDate(v)||D.config.inicio;
    else if(k==='dias')D.config.dias=num(v)||7;
    else if(k==='casas')D.config.casas=num(v)||50;
    else if(k==='modo')D.config.modo=nk(v)==='passagem'?'passagem':'pouso';
    else if(k==='casasporponto')D.config.casasPorPonto=num(v)||1;
    else if(k==='exemplo')D.config.exemplo=num(v)===1;
    else if(k==='logocontroldesk')D.config.logoControlDesk=String(v).trim();
    else if(k==='logofunchal')D.config.logoFunchal=String(v).trim();
    else if(k==='pastafotos')D.config.pastaFotos=String(v).trim();});
  else warn.push('Aba "Config" não encontrada. Usei os valores padrão.');
  const pr=rowsOf(wb,'premios');
  if(pr)pr.forEach(r=>{if(!r.nome)return;D.premios.push({id:slug(r.nome),nome:String(r.nome),icone:String(r.icone||'🎁'),cor:String(r.cor||'#3a5fcd'),descricao:String(r.descricao||'')});});
  if(!D.premios.length){warn.push('Aba "Premios" vazia ou ausente. Usei os prêmios padrão.');D.premios=DEMO.premios;}
  const ca=rowsOf(wb,'casas');
  if(ca)ca.forEach(r=>{const n=num(r.casa);if(!n)return;const id=slug(r.premio);
    if(!D.premios.find(p=>p.id===id)){warn.push('Casa '+n+': prêmio "'+r.premio+'" não existe na aba Premios.');return;}
    if(n>D.config.casas)warn.push('Casa '+n+' passa do total de casas ('+D.config.casas+').');
    D.casas.push({n,premio:id});});
  else{warn.push('Aba "Casas" não encontrada. Usei as casas padrão.');D.casas=DEMO.casas;}
  const op=rowsOf(wb,'operadores');
  if(op)op.forEach(r=>{if(!r.nome)return;const nome=String(r.nome).trim();
    D.operadores.push({nome,apelido:String(r.apelido||'').trim(),equipe:String(r.equipe||'').trim(),cor:String(r.cor||'').trim()||PAL[D.operadores.length%PAL.length],foto:String(r.foto||'').trim()});});
  if(!D.operadores.length)warn.push('Aba "Operadores" vazia ou ausente.');
  const names=new Set(D.operadores.map(o=>slug(o.nome)));
  const la=rowsOf(wb,'lancamentos');
  if(la)la.forEach((r,i)=>{if(!r.operador)return;const d=toDate(r.data);
    if(!d){warn.push('Lançamentos linha '+(i+2)+': data inválida.');return;}
    if(!names.has(slug(r.operador))){warn.push('Lançamentos linha '+(i+2)+': operador "'+r.operador+'" não está na aba Operadores.');return;}
    D.lancamentos.push({data:d,operador:String(r.operador).trim(),pagamento:num(r.pagamento),acordo:num(r.acordo),meta:num(r.meta),localizacao:num(r.localizacao),atraso:num(r.atrasos??r.atraso),monitoria:num(r.monitoria)});});
  else warn.push('Aba "Lancamentos" não encontrada.');
  const en=rowsOf(wb,'entregas');
  if(en)en.forEach(r=>{if(r.operador&&r.casa)D.entregas.push({operador:String(r.operador).trim(),casa:num(r.casa),entregue:['sim','s','x','ok','1','true'].includes(nk(r.entregue))});});
  return {D,warn};
}

function fotoUrl(o){
  const f=o.foto||(slug(o.nome)+'.jpg'); // coluna Foto vazia: procura pelo nome (ex.: mariana-palermo.jpg)
  if(FOTOS[f])return FOTOS[f];
  if(/^(https?:|data:)/.test(f))return f;
  const base=(DATA.config.pastaFotos||'avatares/');return base+(base.endsWith('/')?'':'/')+f;
}
const avUrl=o=>{const u=fotoUrl(o);return u&&AV[u]===true?u:'';};
function avHTML(o,px){
  const u=avUrl(o);
  return `<span class="av" style="width:${px}px;height:${px}px;font-size:${Math.round(px*.38)}px;background:${esc(o.cor)}">${esc(initials(o.apelido||o.nome).toUpperCase())}${u?`<img src="${esc(u)}" alt="">`:''}</span>`;
}
function probe(u){return new Promise(r=>{const im=new Image();im.onload=()=>{AV[u]=true;r(true)};im.onerror=()=>{AV[u]=false;r(false)};im.src=u;});}
let probing=false;
async function probeAssets(){
  if(probing)return;probing=true;
  const jobs=[];let mudou=false;
  C.ops.forEach(o=>{const u=fotoUrl(o);if(u&&!(u in AV))jobs.push(probe(u).then(ok=>{if(ok)mudou=true;}));});
  const lc=DATA.config.logoControlDesk,lf=DATA.config.logoFunchal;
  [['cd',lc],['fn',lf]].forEach(([k,u])=>{if(u&&LOGO[k]!==u&&!(u in AV))jobs.push(probe(u).then(ok=>{if(ok){LOGO[k]=u;mudou=true;}}));else if(u&&AV[u]===true&&LOGO[k]!==u){LOGO[k]=u;mudou=true;}});
  await Promise.all(jobs);probing=false;
  if(mudou&&!playing)render();
}

  const rows=Math.max(3,Math.ceil(N/10)),R=ROWGAP/2,pts=[];

    const y0=TOP+k*ROWGAP,dir=k%2===0?1:-1,sg=k%2?-1:1;
    for(let t=0;t<=XR-XL;t+=4)pts.push({x:dir===1?XL+t:XR-t,y:y0+sg*AMP*Math.sin(Math.PI*t/HALF)});
    if(k<rows-1){const cx=dir===1?XR:XL;for(let a=0.06;a<=Math.PI+1e-6;a+=0.06)pts.push({x:cx+dir*R*Math.sin(a),y:y0+R-R*Math.cos(a)});}
  }
  let L=0;pts[0].s=0;for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);pts[i].s=L;}
  PATH={pts,L};VH=TOP*2+(rows-1)*ROWGAP;
  const at=s=>{let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m].s<s)lo=m;else hi=m;}
    const a=pts[lo],b=pts[hi],f=(s-a.s)/Math.max(1e-6,b.s-a.s);
    const p0=pts[Math.max(0,lo-3)],p1=pts[Math.min(pts.length-1,hi+3)];
    let ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;ang=((ang+45)%90+90)%90-45;

  PATH.studs=[];for(let i=0;i<=N;i++)PATH.studs.push(at((i+.5)*L/(N+1)));
}

function targetAt(i){const t={};C.ops.forEach(o=>t[o.id]=posAt(o,i));return t;}
function animateTo(target){
  return new Promise(res=>{
    clearInterval(timer);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){disp={...target};drawTokens();res();return;}
    const mx=Math.max(1,...C.ops.map(o=>Math.abs(target[o.id]-(disp[o.id]??0))));
    const ms=Math.max(40,Math.min(140,2600/mx));
    timer=setInterval(()=>{
      let mv=false;
      C.ops.forEach(o=>{const d=disp[o.id]??0,t=target[o.id];if(d<t){disp[o.id]=d+1;mv=true;}else if(d>t){disp[o.id]=d-1;mv=true;}});

function plural(n,s,p){return n+' '+(n===1?s:p);}
function mixFor(o,pts){
  if(pts<=0)return '';
  let rest=pts,parts=[];
  if(pts>=1){parts.push(['meta',1]);rest=pts-1;}
  const keys=['pagamento','acordo','localizacao'],tot=keys.reduce((a,x)=>a+o.cat[x],0);
  const w=keys.map(x=>tot?o.cat[x]/tot:1/3),raw=w.map(x=>x*rest),base=raw.map(Math.floor);
  let left=rest-base.reduce((a,x)=>a+x,0);
  raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{if(left>0){base[i]++;left--;}});
  keys.forEach((x,i)=>{if(base[i])parts.push([x,base[i]]);});
  const label={meta:['meta do dia','meta do dia'],pagamento:['pagamento confirmado','pagamentos confirmados'],acordo:['acordo efetivado','acordos efetivados'],localizacao:['contrato localizado','contratos localizados']};
  return parts.map(([k,n])=>k==='meta'?'bater a meta do dia':plural(n,label[k][0],label[k][1])).join(' + ');
}
function goalsFor(o){
  const g=[],ahead=Object.keys(C.casaP).map(Number).filter(h=>h>o.pos).sort((a,b)=>a-b);
  if(ahead[0])g.push({key:'next',label:'Próxima premiada',h:ahead[0]});
  DATA.premios.forEach(p=>{const h=ahead.find(x=>C.casaP[x].id===p.id);if(h)g.push({key:p.id,label:p.icone+' '+p.nome,h});});
  if(o.pos<C.N)g.push({key:'fim',label:'🏆 Chegada',h:C.N});
  return g;
}
function coachHTML(o){
  const goals=goalsFor(o);
  if(!goals.length)return `<section class="panel coach"><h3>Como chegar lá</h3><p class="sub">Você já chegou ao fim da trilha. Parabéns!</p></section>`;
  const g=goals.find(x=>x.key===goalKey)||goals[0];
  const k=C.k,need=Math.ceil((g.h-o.pos)/k),left=C.daysLeft,ppd=left>0?Math.ceil(need/left):Infinity;
  const avg=o.avg,ratio=ppd/Math.max(avg,.5);
  const pr=C.casaP[g.h],dest=g.key==='fim'?'a chegada':(pr?pr.icone+' '+pr.nome:'a casa '+g.h);
  let v,cls,icon;
  if(left===0){cls='hard';icon='⏳';v='A campanha chegou ao fim. Não há mais dias para pontuar.';}
  else if(ratio<=1){cls='ok';icon='✅';v=`No seu ritmo atual (${dec(avg)} pontos por dia) você chega lá.`;}
  else if(ratio<=1.5){cls='mid';icon='💪';v=`Dá para chegar, com um pouco mais do que você faz hoje (${dec(avg)} por dia).`;}
  else{cls='hard';icon='🔥';v=`Exige acelerar bastante: você faz ${dec(avg)} por dia e precisaria de ${ppd}.`;}
  const dAvg=avg>0?Math.ceil(need/avg):Infinity;
  const baseD=C.ultimo||addDays(DATA.config.inicio,-1);
  const fim=addDays(baseD,Math.min(dAvg,99));
  const when=dAvg===Infinity?'Sem pontos até agora':dAvg<=left?`${plural(dAvg,'dia','dias')} · ${fmtD(fim)}`:'Depois do fim da campanha';
  const plan=ppd!==Infinity?(()=>{const arr=[];let r=need;for(let i=0;i<left;i++){const x=Math.ceil(r/(left-i));arr.push(x);r-=x;}return arr.map((x,i)=>`<span>${fmtD(addDays(baseD,i+1))}: ${x} ${x===1?'ponto':'pontos'}</span>`).join('');})():'';
  const mix=ppd!==Infinity?mixFor(o,ppd):'';
  const above=o.rank>1?C.ranking[o.rank-2]:null,below=o.rank<C.ranking.length?C.ranking[o.rank]:null;
  const gap=above?Math.max(1,Math.ceil((above.pos-o.pos)/k)):0;
  const rankTxt=above?`Faltam <b>${plural(gap,'ponto','pontos')}</b> para alcançar ${esc(short(above))} (${o.rank-1}º lugar).`:(below?`Você lidera com <b>${plural(Math.ceil((o.pos-below.pos)/k),'ponto','pontos')}</b> de vantagem sobre ${esc(short(below))}.`:'');
  const lead=C.ranking[0],leadRate=lead.avg;
  const proj=r=>Math.min(C.N,o.pos+Math.round(r*left)*k);
  const scen=[['Ritmo atual',avg],['+2 pontos por dia',avg+2],o.rank>1?['Ritmo do líder ('+esc(short(lead))+')',leadRate]:['Seu melhor dia ('+o.best+')',o.best]];
  const scenRows=scen.map(([l,r])=>{const p=proj(r),pz=C.casaP[p];return `<tr><td>${l}</td><td class="n">${dec(r)}/dia</td><td class="n"><b>${p}</b>${pz?' '+esc(pz.icone):''}</td></tr>`;}).join('');
  const eqNote=o.equipe==='Receptiva'?'Equipe Receptiva: pagamentos contam na faixa acima de 90 dias em atraso.':o.equipe==='Alvo'?'Equipe Alvo: pagamentos contam na faixa abaixo de 90 dias em atraso.':'';
  return `<section class="panel coach"><h3>Como chegar lá</h3><p class="sub">Escolha o objetivo e veja quantos pontos faltam.</p>
   <div class="legend" style="margin:0 0 6px">${goals.map(x=>`<button class="chip plain ${x.key===g.key?'on':''}" data-goal="${esc(x.key)}">${esc(x.label)} · ${x.h}</button>`).join('')}</div>
   <div class="verdict ${cls}"><span class="vi">${icon}</span><span>${v}</span></div>
   <div class="facts"><div class="fact"><span>Pontos que faltam</span><b>${need}</b></div><div class="fact"><span>Dias restantes</span><b>${left}</b></div><div class="fact"><span>Por dia, para chegar</span><b>${ppd===Infinity?'—':ppd}</b></div>
     <div class="fact"><span>Você tem</span><b>${o.pos} pontos</b></div><div class="fact"><span>Objetivo</span><b>${g.h} pontos</b></div><div class="fact"><span>No ritmo atual</span><b style="font-size:14px">${when}</b></div></div>
   ${plan?`<div><small style="color:var(--muted)">Plano diário para chegar à casa ${g.h} para ${dest}:</small><div class="plan">${plan}</div></div>`:''}
   ${mix?`<div class="mix"><b>Receita para um dia de ${ppd} ${ppd===1?'ponto':'pontos'}:</b> ${mix}.<br><small style="color:var(--muted)">Baseada no que você mais faz. Cada atraso ou falta tira 1 ponto. ${esc(eqNote)}</small></div>`:''}
   ${C.modo==='pouso'?`<p class="sub" style="margin:10px 0 0">Nesta campanha o prêmio vale quando você <b>para</b> na casa no fim do dia. Feche o dia exatamente na casa ${g.h}.</p>`:''}
   ${rankTxt?`<p style="margin:12px 0 0">${rankTxt}</p>`:''}
   <h3 style="margin-top:16px;font-size:17px">Até onde você chega</h3>
   <div class="tscroll"><table><thead><tr><th>Cenário</th><th class="n">Ritmo</th><th class="n">Casa no fim</th></tr></thead><tbody>${scenRows}</tbody></table></div></section>`;
}
function vPainel(){
  const o=C.ops.find(x=>x.id===selOp);
  const sel=`<div class="who">${o?avHTML(o,64):''}<div><label for="opsel" style="font-weight:700;display:block;font-size:13px;color:var(--muted)">Quem é você?</label><select id="opsel">${C.ops.map(x=>`<option value="${x.id}" ${x.id===selOp?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div></div>`;
  if(!o)return `<section class="panel"><h2>Meu painel</h2>${sel}<div class="empty">Sem jogadores cadastrados.</div></section>`;
  const nextH=Object.keys(C.casaP).map(Number).filter(h=>h>o.pos).sort((a,b)=>a-b)[0];
  const next=nextH?plural(Math.ceil((nextH-o.pos)/C.k),'ponto','pontos'):'—';const nextP=nextH?C.casaP[nextH]:null;
  return `<section class="panel"><h2>Meu painel</h2>${sel}
   <div class="tiles"><div class="tile"><span>Pontos</span><b>${o.pos}</b><small>de ${C.N} para a chegada</small></div><div class="tile"><span>Ranking</span><b>${o.rank}º</b></div>
   <div class="tile"><span>Próxima premiada</span><b>${next}</b>${nextP?`<small>${esc(nextP.icone)} ${esc(nextP.nome)} · casa ${nextH}</small>`:''}</div></div>
   ${coachHTML(o)}</section>
   <div class="grid2" style="margin-top:16px"><section class="panel"><h3>Dia a dia</h3><div class="tscroll"><table><thead><tr><th>Dia</th>${CATS.map(c=>`<th class="n" title="${c[1]}">${c[3]}</th>`).join('')}<th class="n">Pontos</th><th class="n">Casa</th></tr></thead><tbody>
    ${[...o.days].reverse().map(d=>`<tr><td>${fmtD(d.data)}</td>${CATS.map(c=>`<td class="n">${d.v[c[0]]||'·'}</td>`).join('')}<td class="n ${d.pts>0?'up':d.pts<0?'down':''}">${d.pts>0?'+':''}${d.pts}</td><td class="n"><b>${d.pos}</b>${d.got.length?' '+d.got.map(g=>esc(g.premio.icone)).join(''):''}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">Sem lançamentos.</td></tr>'}
    </tbody></table></div></section>
    <section class="panel"><h3>Meus prêmios</h3>${o.prizes.length?`<ul class="feed">${o.prizes.map(p=>`<li><span class="ic">${esc(p.premio.icone)}</span><div><b>${esc(p.premio.nome)}</b><small>Casa ${p.casa} · ${fmtD(p.data)}</small></div><span class="pill" style="margin-left:auto;${p.entregue?'border-color:var(--ok);color:var(--ok)':''}">${p.entregue?'Entregue':'A receber'}</span></li>`).join('')}</ul>`:'<div class="empty">Ainda sem prêmios. Veja acima o que falta para o próximo.</div>'}</section></div>`;
}
function vPremios(){
  const cnt={};C.feed.forEach(f=>cnt[f.premio.id]=(cnt[f.premio.id]||0)+1);
  const reached=new Set(C.feed.map(f=>f.casa));
  return `<section class="panel"><h2>Prêmios das casas especiais</h2><p class="sub">Casas em destaque já foram alcançadas por alguém.</p>
   <div class="grid3">${DATA.premios.map(p=>{const hs=DATA.casas.filter(c=>c.premio===p.id).map(c=>c.n).sort((a,b)=>a-b);
    return `<div class="pcard" style="background:linear-gradient(160deg,${esc(p.cor)},${esc(p.cor)}cc)"><span class="bigi">${esc(p.icone)}</span><h3>${esc(p.nome)}</h3><p>${esc(p.descricao)}</p>
    <div style="margin-top:6px"><b>${hs.length}</b> ${hs.length===1?'casa':'casas'} · <b>${cnt[p.id]||0}</b> ${(cnt[p.id]||0)===1?'conquistado':'conquistados'}</div>
    <div>${hs.map(h=>`<span class="hn ${reached.has(h)?'hit':''}">${h}</span>`).join('')}</div></div>`;}).join('')}</div></section>`;
}
function vRegras(){
  const R=[['💲','Pagamento confirmado e elegível','Pagamento efetivamente confirmado e validado.',1],['🤝','Acordo efetivado','Acordo válido e devidamente registrado.',1],['🎯','Meta diária individual atingida','Bônus concedido uma única vez por dia ao atingir a meta definida.',1],['📍','Localização de contrato','Cada contrato localizado e validado dentro da faixa de performance definida pelo banco.',1],['⏰','Atrasos ou faltas injustificadas','Descontos por atrasos ou faltas sem justificativa.',-1],['🛡️','Pontuação grave na monitoria','Penalização aplicada após confirmação da ocorrência pela área responsável.',-1]];
  return `<div class="grid2"><section class="panel"><h2>Sistema de pontuação</h2><p class="sub">Cada resultado vale 1 ponto.</p>
   ${R.map(r=>`<div class="rule"><span class="ri">${r[0]}</span><div><b>${r[1]}</b><small>${r[2]}</small></div><span class="pts ${r[3]<0?'neg':''}">${r[3]>0?'+':'−'}1</span></div>`).join('')}
   <div class="banner" style="margin:14px 0 0"><b>Equipe Receptiva:</b> conta pagamento confirmado na faixa acima de 90 dias em atraso.<br><b>Equipe Alvo:</b> conta pagamento confirmado na faixa abaixo de 90 dias em atraso.</div></section>
   <section class="panel"><h2>Como funciona</h2><ol class="how">
    <li>Cada resultado conquistado no dia vale 1 ponto, conforme os critérios ao lado.</li>
    <li>No fim do dia, a sua pontuação define quantas casas você avança na trilha.</li>
    <li>${C.modo==='pouso'?'Ao parar numa casa premiada, você conquista o prêmio da casa.':'Ao passar por uma casa premiada, você conquista o prêmio da casa.'}</li>
    <li>As demais casas são em branco, para deixar o jogo mais emocionante e duradouro.</li>
    <li>A campanha dura ${C.dias} dias. Acompanhe seu desempenho todo dia.</li>
    <li>Em Meu painel, escolha um prêmio e veja quantos pontos faltam e como chegar lá.</li>
    <li>Quanto mais pontos, mais longe você vai.</li></ol></section></div>`;
}
function vGestor(){
  const url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit',w=LOAD.warn;
  const st=LOAD.erro?`<div class="banner err">${esc(LOAD.erro)}</div>`:LOAD.quando?`<div class="banner okb">Planilha lida às ${LOAD.quando.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}: ${C.ops.length} jogadores e ${DATA.lancamentos.length} lançamentos.</div>`:'<div class="banner">Lendo a planilha…</div>';
  const semFoto=C.ops.filter(o=>!avUrl(o)).map(o=>short(o));
  return `<div class="grid2"><section class="panel"><h2>Área do gestor</h2>
   <p class="sub">O jogo lê a planilha do Google. Mudou a planilha, mudou o jogo, sem publicar nada.</p>${st}
   <div class="steps">
    <div class="step"><span class="no">1</span><div><b>Abra a planilha</b><p class="sub" style="margin:2px 0 8px">Edite direto no Google Sheets, no computador ou no celular.</p><a class="btn" style="display:inline-block;text-decoration:none" href="${url}" target="_blank" rel="noopener">Abrir planilha</a></div></div>
    <div class="step"><span class="no">2</span><div><b>Lance o dia</b><p class="sub" style="margin:2px 0 0">Na aba <code>Lancamentos</code>, uma linha por operador: data, nome (escolha na lista) e as quantidades. A coluna de pontos calcula sozinha.</p></div></div>
    <div class="step"><span class="no">3</span><div><b>Confira aqui</b><p class="sub" style="margin:2px 0 8px">A página atualiza sozinha a cada 5 minutos para quem a deixa aberta. Para ver na hora:</p><button class="btn sec" id="btnRefresh">Atualizar agora</button></div></div>
   </div>
   ${w.length?`<h3 style="margin-top:18px">Avisos da última leitura</h3><ul class="warnlist">${w.slice(0,15).map(x=>`<li>${esc(x)}</li>`).join('')}${w.length>15?`<li>e mais ${w.length-15} avisos.</li>`:''}</ul>`:'<p class="sub" style="margin-top:14px">Nenhum aviso. Todos os lançamentos foram aceitos.</p>'}
   </section>
   <aside class="col">
    <section class="panel"><h3>Situação atual</h3><ul class="feed">
      <li><div><b>Fonte</b><small>${SRC.tipo==='planilha'?'Planilha do Google':SRC.tipo==='cache'?'Última leitura salva neste aparelho':'Dados de exemplo'}</small></div></li>
      <li><div><b>${DATA.casas.length} casas premiadas</b><small>de ${C.N} casas · prêmio vale ${C.modo==='pouso'?'ao parar na casa':'ao passar pela casa'}</small></div></li>
      <li><div><b>Último dia lançado</b><small>${C.ultimo?fmtD(C.ultimo):'nenhum'} · faltam ${C.daysLeft} dias</small></div></li>
      <li><div><b>Logo do Control Desk</b><small>${LOGO.cd?'Carregada':'Não encontrada. Coloque o arquivo em assets/logo-control-desk.png'}</small></div></li>
      <li><div><b>Fotos</b><small>${semFoto.length?'Sem foto: '+esc(semFoto.join(', ')):'Todos com foto'}</small></div></li></ul></section>
   </aside></div>`;
}

/* =========================================================
   8) RENDER E EVENTOS
   ========================================================= */
function render(){
  clearInterval(timer);renderHead();const v=document.getElementById('view');
  v.innerHTML=tab==='mapa'?vMapa():tab==='ranking'?vRanking():tab==='painel'?vPainel():tab==='premios'?vPremios():tab==='regras'?vRegras():vGestor();
  if(tab==='mapa')startMap();
  if(tab==='gestor'){const b=document.getElementById('btnRefresh');if(b)b.onclick=()=>{b.disabled=true;b.textContent='Atualizando…';loadSheet().then(()=>{if(tab==='gestor')render();});};}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){playing=false;tab=t.dataset.tab;render();return;}
  const eq=e.target.closest('[data-eq]');if(eq){rankEq=eq.dataset.eq;render();return;}
  const gl=e.target.closest('[data-goal]');if(gl){goalKey=gl.dataset.goal;render();return;}
  if(e.target.closest('#btnPlay')){play();return;}
  const dc=e.target.closest('.dchip');if(dc){playing=false;btnPlayState();setViewDay(+dc.dataset.d);return;}
  const cell=e.target.closest('.cell');if(cell){selCell=+cell.dataset.n;const c=document.getElementById('cellinfo');if(c)c.innerHTML=cellInfo(selCell);return;}
  const op=e.target.closest('[data-op]');if(op){selOp=op.dataset.op;try{localStorage.setItem('nd_op',selOp);}catch(x){}playing=false;tab='painel';render();window.scrollTo({top:0});}
});
(function(){
  const h=document.createElement('div');h.className='hcard';h.setAttribute('aria-hidden','true');document.body.appendChild(h);let cur='';
  document.addEventListener('mouseover',e=>{const k=e.target.closest&&e.target.closest('.tok');if(!k){h.classList.remove('on');cur='';return;}
    const o=C.ops.find(x=>x.id===k.dataset.op);if(!o)return;
    if(cur!==o.id){cur=o.id;h.innerHTML=avHTML(o,64)+`<div><b>${esc(short(o))}</b><small>${o.pos} pontos${o.equipe?' · '+esc(o.equipe):''}</small></div>`;}
    h.classList.add('on');});
  document.addEventListener('mousemove',e=>{if(!h.classList.contains('on'))return;const w=h.offsetWidth;h.style.left=Math.min(innerWidth-w-8,e.clientX+16)+'px';h.style.top=Math.max(8,e.clientY-70)+'px';});
  document.addEventListener('mouseleave',()=>h.classList.remove('on'));
})();
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cell')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='opsel'){selOp=e.target.value;try{localStorage.setItem('nd_op',selOp);}catch(x){}render();}});
window.addEventListener('hashchange',()=>{if(location.hash!=='#gestor'&&tab==='gestor')tab='mapa';render();});

(function coins(){const el=document.getElementById('coins');let h='';for(let i=0;i<6;i++)h+=`<span class="coin" style="left:${(55+i*8+Math.random()*6).toFixed(0)}%;--s:${14+Math.round(Math.random()*14)}px;--t:${(6+Math.random()*6).toFixed(1)}s;--d:${(-Math.random()*10).toFixed(1)}s"></span>`;el.innerHTML=h;})();
if(location.hash==='#gestor')tab='gestor';
render();probeAssets();
loadSheet();
setInterval(loadSheet,REFRESH_MS);
async function checkVersion(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD)location.reload();}catch(e){}}
setInterval(checkVersion,5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadSheet();checkVersion();}});
</script>
